name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tesseract installieren
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu
      - name: Python-Pakete installieren
        run: pip install -r requirements-dev.txt
      - name: Tests ausführen
        run: pytest -q
